
name: Build Lunar Lite APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto
        run: |
          mkdir proyecto
          unzip -o *.zip -d proyecto
          find proyecto -name settings.gradle.kts

      - name: Compilar APK
        run: |
          cd proyecto/LunarLite10
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Lunar-Lite-1.0-APK
          path: proyecto/LunarLite10/app/build/outputs/apk/debug/*.apk
